# Everything needed to test and package the extension, without Node.js
# installed system-wide:
#
#     pixi run test     the tests (see test/connect.test.js for the full one)
#     pixi run vsix     build gosh-remote-VERSION.vsix
#     pixi run shpool   fetch the shpool the extension carries for hosts without
#                       one (a gosh-shpool release, checked; tools/build-shpool.js);
#                       the .vsix includes whatever has been fetched
#
# pixi provides Node.js; the packaging tool (vsce) comes from npm, at the
# version recorded in package-lock.json.

[workspace]
name = "gosh-remote"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
nodejs = "22.*"

[tasks]
# the packaging tool, exactly as locked
deps = { cmd = "npm ci --no-audit --no-fund", inputs = ["package.json", "package-lock.json"], outputs = ["node_modules/.package-lock.json"] }
test = "node test/connect.test.js"
vsix = { cmd = "npm run package", depends-on = ["deps"] }
shpool = "node tools/build-shpool.js"
shpool-test = { cmd = "python3 test/shpool.test.py shpool/linux-x64/shpool", depends-on = ["shpool"] }
